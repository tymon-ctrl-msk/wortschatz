<title>Wortschatz A2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a phone app; a yellow German town-sign plate as the masthead; der/die/das colours carry the whole visual system. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --fg:#152027; --muted:#56636D; --line:#D5DCE1;
  --sign:#F2C230; --sign-ink:#111111;
  --der:#1D5FC4; --die:#C42F3A; --das:#18824A; --pl:#9A6400;
  --ok:#0F7A5F; --bad:#B4441B;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1418; --surface:#182026; --surface-2:#1E272E; --fg:#E6ECEF; --muted:#9AA7B0; --line:#2B363E;
  --der:#74A9FF; --die:#FF7D86; --das:#5CCB8C; --pl:#E7AE4F; --ok:#52C9A4; --bad:#FF8F66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#182026; --surface-2:#1E272E; --fg:#E6ECEF; --muted:#9AA7B0; --line:#2B363E;
  --der:#74A9FF; --die:#FF7D86; --das:#5CCB8C; --pl:#E7AE4F; --ok:#52C9A4; --bad:#FF8F66; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
#app{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.9rem}
h1,h2,h3{margin:0;text-wrap:balance}

/* masthead: Ortstafel */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:5px}
.sign-in{border:3px solid var(--sign-ink);border-radius:8px;padding:10px 14px 8px;text-align:center}
.sign-title{font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:.01em}
.sign-sub{font-weight:600;font-size:.95rem;margin-top:2px}

.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h2{font-family:var(--font-display);font-weight:700;font-size:1.6rem;margin-top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--sign);color:var(--sign-ink);border-color:transparent}
.btn-primary:hover{filter:brightness(.97);border-color:transparent}
.btn-quiet{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn-quiet:hover{color:var(--fg);border-color:transparent}
.wide{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;color:var(--fg);flex:none}
.icon-btn.sm{width:32px;height:32px}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm svg{width:15px;height:15px}

/* panels on home */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cont-t{display:flex;align-items:center;gap:12px}
.cont-t > div{min-width:0}
.lnum-s{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;min-width:2.2rem;text-align:center;font-variant-numeric:tabular-nums}
.cont-de{font-family:var(--font-display);font-weight:700;font-size:1.6rem;line-height:1.1}
.partbar{display:flex;gap:6px}
.partbar .pb{flex:1;height:8px;border-radius:4px;background:var(--line)}
.partbar .pb.done{background:var(--ok)}
.partbar .pb.cur{background:var(--sign);box-shadow:0 0 0 1px color-mix(in srgb,var(--sign-ink) 25%,transparent) inset}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:2px}
.li + .li{border-top:1px solid var(--line);padding-top:12px}
.li.is-off .st-t{color:var(--muted)}
.sb{min-width:0;display:flex;flex-direction:column;gap:2px}
.st-t{font-weight:600;font-variant-numeric:tabular-nums}
.move-body{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.move-body p{margin:0}
.code{width:100%;min-height:64px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--fg);resize:vertical;word-break:break-all}
#imp-msg .btn{min-height:38px;padding:6px 12px;margin-top:6px}
.install{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--muted);font-size:.92rem}
.install span{color:var(--muted)}
.lbadge{font-size:.8rem;font-weight:600;margin-top:2px}
.lbadge.ok{color:var(--ok)} .lbadge.todo{color:var(--pl)}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-width:44px;min-height:34px;padding:4px 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;border-top:1px solid var(--line);padding-top:12px}
.stats div{min-width:0}
.stats dt{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* test input */
.tform{display:flex;flex-direction:column;gap:10px}
.tin{font:inherit;font-size:1.3rem;font-weight:500;padding:12px 14px;border-radius:12px;border:1px solid var(--muted);background:var(--surface);color:var(--fg);width:100%;min-width:0}
.tin:focus{outline:3px solid var(--der);outline-offset:1px}
.tin[disabled]{opacity:.8}
.uml{display:flex;gap:6px;flex-wrap:wrap}
.uml button{min-width:46px;min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:1.1rem;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.score{font-family:var(--font-display);font-weight:700;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.score.pass{color:var(--ok)} .score.fail{color:var(--bad)}

/* flashcards */
.fc-counts{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 12px;border-radius:999px;border:2px solid;font-size:1rem}
.cnt.still{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.cnt.know{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.fc-wrap{perspective:1400px}
.fc{position:relative;height:clamp(250px,46vh,380px);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;outline:none;transition:transform .22s ease}
.fc.dragging{transition:none}
.fc:focus-visible .fc-face{outline:3px solid var(--der);outline-offset:2px}
.fc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.fc-in.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:44px 22px 28px;text-align:center;
  box-shadow:0 1px 2px color-mix(in srgb,var(--fg) 6%,transparent),0 10px 28px -14px color-mix(in srgb,var(--fg) 30%,transparent)}
.fc-back{transform:rotateY(180deg);background:var(--surface-2)}
.fc-in.flipped .fc-front,.fc-in:not(.flipped) .fc-back{pointer-events:none}
.fc-term{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,9vw,2.9rem);line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.fc-side{position:absolute;top:14px;left:16px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fc-say{position:absolute;top:10px;right:10px}
.fc.to-know .fc-face{box-shadow:0 0 0 3px var(--ok) inset}
.fc.to-still .fc-face{box-shadow:0 0 0 3px var(--bad) inset}
.fc.fly-right{transform:translateX(130%) rotate(14deg)!important;transition:transform .2s ease-in}
.fc.fly-left{transform:translateX(-130%) rotate(-14deg)!important;transition:transform .2s ease-in}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-btns .btn{min-height:54px;font-size:1.05rem}
.btn-still{color:var(--bad);border:2px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn-know{color:var(--ok);border:2px solid color-mix(in srgb,var(--ok) 45%,var(--line))}
.fc-tools{display:flex;justify-content:center}
.fc-hint{margin:0;text-align:center}

/* lessons */
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lrow{width:100%;display:grid;grid-template-columns:2.4rem 1fr auto;grid-template-areas:"num t c" "num bar bar";column-gap:12px;row-gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.lrow:hover{border-color:var(--muted)}
.lnum{grid-area:num;font-family:var(--font-display);font-weight:700;font-size:1.7rem;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow.is-current .lnum{color:var(--fg)}
.lt{grid-area:t;min-width:0;display:flex;flex-direction:column}
.lde{font-weight:600}
.lpl{font-size:.88rem;color:var(--muted)}
.lcount{grid-area:c;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-area:bar;display:flex;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.b-m{background:var(--fg)} .b-l{background:var(--muted);opacity:.55}

/* articles */
.art{font-weight:700}
.a-der{color:var(--der)} .a-die{color:var(--die)} .a-das{color:var(--das)} .a-pl{color:var(--pl)}

/* word card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.g-der{background:color-mix(in srgb,var(--der) 7%,var(--surface));border-color:color-mix(in srgb,var(--der) 30%,var(--line))}
.card.g-die{background:color-mix(in srgb,var(--die) 7%,var(--surface));border-color:color-mix(in srgb,var(--die) 30%,var(--line))}
.card.g-das{background:color-mix(in srgb,var(--das) 7%,var(--surface));border-color:color-mix(in srgb,var(--das) 30%,var(--line))}
.card.g-pl{background:color-mix(in srgb,var(--pl) 8%,var(--surface));border-color:color-mix(in srgb,var(--pl) 30%,var(--line))}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tlabel{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hw{font-family:var(--font-display);font-weight:700;font-size:2.5rem;line-height:1.05;overflow-wrap:anywhere}
.forms{color:var(--muted);font-weight:500}
.mean{font-size:1.25rem;font-weight:600}
.ex{border-top:1px solid color-mix(in srgb,var(--fg) 12%,transparent);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.ex-de{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-weight:500}
.ex-pl{color:var(--muted);font-size:.95rem}
.tip{font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.tip b{font-weight:600}

/* session chrome */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar .t{font-weight:600;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--fg)}

/* quiz */
.qprompt{font-weight:600;color:var(--muted)}
.qbig{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1.1;overflow-wrap:anywhere}
.qsub{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts-art{display:grid;grid-template-columns:repeat(3,1fr)}
.opt{min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;font-size:1.1rem;font-weight:500;cursor:pointer}
.opts-art .opt{text-align:center;font-size:1.3rem;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.is-ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.is-bad{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.opt.is-dim{opacity:.55}
.fb{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.fb .v{font-weight:700}
.fb .v.ok{color:var(--ok)} .fb .v.bad{color:var(--bad)}

/* lesson page */
.lhead{display:flex;flex-direction:column;gap:4px}
.lhead h1{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1.05}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.85rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.actions{display:flex;flex-direction:column;gap:8px}
.parts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding-block:12px}
.prow + .prow{border-top:1px solid var(--line)}
.prow.is-off .st-t{color:var(--muted)}
.prow .pbtns{display:flex;gap:6px}
.prow .pbtns .btn{min-height:40px;padding:8px 12px}
.ok-t{color:var(--ok)}
.wlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wlist li + li{border-top:1px solid var(--line)}
.wsep{padding:8px 14px;background:var(--surface-2);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrow{width:100%;display:grid;grid-template-columns:10px 1fr;column-gap:12px;align-items:center;padding:11px 14px;background:transparent;border:0;text-align:left;cursor:pointer}
.wrow .st{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.wrow .st.learn{border-color:var(--muted);background:transparent}
.wrow .st.master{border-color:var(--fg);background:var(--fg)}
.wrow .w{min-width:0;display:flex;flex-direction:column}
.wrow .w b{font-weight:600}
.wrow .w span{color:var(--muted);font-size:.92rem}
.wdetail{padding:0 14px 14px 36px;display:flex;flex-direction:column;gap:8px}
.wdetail .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* reading text */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:1.15rem;line-height:1.7}
.reader p{margin:0}
.tw{background:none;border:0;padding:0;font:inherit;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tw.t-der{text-decoration-color:var(--der)} .tw.t-die{text-decoration-color:var(--die)} .tw.t-das{text-decoration-color:var(--das)} .tw.t-pl{text-decoration-color:var(--pl)} .tw.t-x{text-decoration-color:var(--muted)}
.tr{color:var(--muted);font-size:1rem;line-height:1.6;border-left:3px solid var(--line);padding-left:12px;margin:0}
.pop{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pop .hwsm{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.1}
.pop > div{min-width:0}

/* done */
.done{display:flex;flex-direction:column;gap:6px}
.done h1{font-family:var(--font-display);font-weight:700;font-size:2.2rem}
.done p{margin:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:flex;gap:10px;align-items:baseline}
.rlist .mk{font-weight:700;width:1.2em;flex:none}
.rlist .mk.ok{color:var(--ok)} .rlist .mk.bad{color:var(--bad)}

/* footer */
.foot{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px;margin-top:6px;font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
.how summary{cursor:pointer;font-weight:600}
.how p{margin:8px 0 0;color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--fg)}
.sync{margin:0;color:var(--muted)}
.reset{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kbd{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
@media (hover:none){.kbd{display:none}}

@media (max-width:420px){
  .hw{font-size:2.15rem}
  .stats{grid-template-columns:repeat(2,1fr);row-gap:10px}
  .sign-title{font-size:2.3rem}
}
@media (prefers-reduced-motion:no-preference){
  .card,.fb,.pop{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){
  .fc,.fc-in{transition:none!important}
}
</style>

<main id="app" aria-live="polite"></main>

<script>
(function(){
'use strict';
/*__DATA__*/

const ART={m:'der',f:'die',n:'das',p:'die'};
const GCLS={m:'der',f:'die',n:'das',p:'pl'};
const TLABEL={m:'rzeczownik',f:'rzeczownik',n:'rzeczownik',p:'rzeczownik · tylko l. mn.',v:'czasownik',a:'przymiotnik',ad:'przysłówek',pr:'zaimek',q:'słowo pytające',pp:'przyimek',k:'spójnik',z:'liczebnik',x:'zwrot'};
const INTERVALS=[0,1,3,7,14,30,60];
const STANDALONE=/*__STANDALONE__*/false;
const MASTER=4, MAXBOX=6, REVIEW_MAX=50, TEST_N=25, PASS=80, PART=20;
const BUILD='__BUILD__';
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const REDUCE=(function(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();

const WORDS=[]; const BYKEY=new Map(); const BYLOW=new Map();
LESSONS.forEach((L,li)=>{L.items=[];L.words.forEach((w,wi)=>{
  const o={t:w[0],de:w[1],forms:w[2]||'',pl:w[3],ex:w[4]||'',exPl:w[5]||'',tip:w[6]||'',li:li,wi:wi,key:w[1]};
  WORDS.push(o);L.items.push(o);BYKEY.set(w[1],o);if(!BYLOW.has(w[1].toLowerCase()))BYLOW.set(w[1].toLowerCase(),o);});
  if(!L.id)L.id='T'+(li+1);
  L.grund=L.id.charAt(0)==='G';
  L.num=L.grund?L.id:L.id.slice(1);
  L.label=L.grund?'Grundwortschatz '+L.id:'Lektion '+L.num;
  /* każda część ma mieszankę: rzeczowniki, czasowniki, przymiotniki i resztę, rozłożone równo */
  const cls=w=>(w.t==='m'||w.t==='f'||w.t==='n'||w.t==='p')?'N':(w.t==='v'||w.t==='a')?w.t:'o';
  const groups={};L.items.forEach(w=>{const c=cls(w);(groups[c]=groups[c]||[]).push(w);});
  const order=[];Object.keys(groups).forEach((g,gi)=>{const arr=groups[g];arr.forEach((w,j)=>order.push({w:w,k:(j+0.5)/arr.length,g:gi}));});
  order.sort((a,b)=>a.k-b.k||a.g-b.g);
  const seq=order.map(o=>o.w);
  const n=seq.length,k=Math.max(1,Math.round(n/PART)),base=Math.floor(n/k),extra=n%k;
  L.parts=[];let s=0;
  for(let p=0;p<k;p++){const size=base+(p<extra?1:0);const arr=seq.slice(s,s+size);arr.forEach(w=>{w.pi=p;});L.parts.push(arr);s+=size;}
});

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function plural(n,one,few,many){const n10=n%10,n100=n%100;if(n===1)return one;if(n10>=2&&n10<=4&&(n100<12||n100>14))return few;return many;}
function slow(n){return n+' '+plural(n,'słowo','słowa','słów');}
function word(k){k=String(k);return BYKEY.get(k)||BYLOW.get(k.toLowerCase());}
function artHtml(a,cls){return '<span class="art a-'+(cls||{der:'der',die:'die',das:'das'}[a])+'">'+a+'</span>';}
function hw(w){const a=ART[w.t];return a?artHtml(a,GCLS[w.t])+' '+esc(w.de):esc(w.de);}
function plainHw(w){const a=ART[w.t];return a?a+' '+w.de:w.de;}
function formsText(w){
  if(w.t==='p')return 'tylko liczba mnoga';
  if(w.t==='m'||w.t==='f'||w.t==='n')return (w.forms&&w.forms!=='–')?'l. mn.: die '+w.forms:'bez liczby mnogiej';
  return w.forms;
}
function isNoun(w){return w.t==='m'||w.t==='f'||w.t==='n';}

/* ---------- speech ---------- */
const canSpeak=(function(){try{return 'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';}catch(e){return false;}})();
let deVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices()||[];deVoice=vs.find(v=>/^de[-_]DE/i.test(v.lang))||vs.find(v=>/^de/i.test(v.lang))||null;}catch(e){}}
if(canSpeak){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}}
function say(text){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';if(deVoice)u.voice=deVoice;u.rate=0.92;speechSynthesis.speak(u);}catch(e){}}
function sayWord(w){say(plainHw(w).replace(/!$/,''));}

/* ---------- progress state ---------- */
const LS='wortschatz-a2-v1';
function fresh(){return {v:1,c:{},l:{},t:{},pp:{},log:{},say:true,dir:'de',savedAt:0};}
function valid(s){return !!(s&&typeof s==='object'&&s.c&&typeof s.c==='object');}
function normalize(s){const f=fresh();const o=Object.assign(f,s);['log','l','t','pp'].forEach(k=>{if(!o[k]||typeof o[k]!=='object')o[k]={};});if(o.dir!=='pl')o.dir='de';
  const t2={};Object.keys(o.t).forEach(k=>{t2[/^\d+$/.test(k)?'T'+(+k+1):k]=o.t[k];});o.t=t2;return o;}
function loadLocal(){try{const r=localStorage.getItem(LS);if(!r)return null;const s=JSON.parse(r);return valid(s)?normalize(s):null;}catch(e){return null;}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let state=loadLocal()||fresh();

const remote={ref:null,mode:'local',busy:false,dirty:false,timer:null};
function touch(){state.savedAt=Date.now();saveLocal();if(remote.ref){remote.dirty=true;clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,1500);}}
async function flushRemote(){
  if(!remote.ref||remote.busy||!remote.dirty)return;
  remote.busy=true;remote.dirty=false;
  try{await remote.ref.set(JSON.parse(JSON.stringify(state)));}
  catch(e){
    const code=e&&e.code;
    if(code==='unavailable'||code==='resource_exhausted'){remote.dirty=true;}
    else{remote.ref=null;remote.mode='local';updateSync();}
  }finally{
    remote.busy=false;
    if(remote.dirty&&remote.ref){clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,4000);}
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&remote.dirty){clearTimeout(remote.timer);flushRemote();}});

async function connect(){
  try{
    const c=window.claude;
    if(!c||typeof c.use!=='function')return;
    const res=await Promise.all([c.use('db'),c.use('user')]);
    const db=res[0],user=res[1];
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    remote.ref=ref;remote.mode='account';
    if(snap.exists){
      const r=snap.data();
      if(valid(r)&&(r.savedAt||0)>(state.savedAt||0)){
        state=normalize(JSON.parse(JSON.stringify(r)));saveLocal();
        if(!session)render();
      }else if((state.savedAt||0)>((r&&r.savedAt)||0)){remote.dirty=true;flushRemote();}
    }else if(Object.keys(state.c).length){remote.dirty=true;flushRemote();}
    updateSync();
  }catch(e){}
}

let pendingImport=null;
function b64e(str){const by=new TextEncoder().encode(str);let bin='';for(let i=0;i<by.length;i++)bin+=String.fromCharCode(by[i]);return btoa(bin);}
function b64d(b){const bin=atob(b);const by=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder().decode(by);}
function exportCode(){return 'WSA2:'+b64e(JSON.stringify({v:1,c:state.c,l:state.l,t:state.t,pp:state.pp,log:state.log,say:state.say,dir:state.dir}));}
function importCode(txt){try{const m=String(txt||'').replace(/\s+/g,'').match(/^WSA2:(.+)$/);if(!m)return null;const s=JSON.parse(b64d(m[1]));return valid(s)?normalize(s):null;}catch(e){return null;}}

function setCard(k,box,due){state.c[k]=[box,due];}
function status(k){const c=state.c[k];if(!c)return 'new';return c[0]>=MASTER?'master':'learn';}

  for(const k of Object.keys(state.log)){if(+k<d-120)delete state.log[k];}
}
function streak(){let d=today();if(!state.log[d])d--;let n=0;while(state.log[d]){n++;d--;}return n;}
function dueKeys(){const t=today();return WORDS.filter(w=>{const c=state.c[w.key];return c&&c[1]<=t;}).map(w=>w.key);}
function lessonStats(L){let n=0,l=0,m=0;L.items.forEach(w=>{const s=status(w.key);if(s==='new')n++;else if(s==='master')m++;else l++;});return {n:n,l:l,m:m,total:L.items.length};}
function pkey(li,p){return LESSONS[li].id+':'+p;}
function partDone(li,p){return LESSONS[li].parts[p].every(w=>state.c[w.key]);}
function partPassed(li,p){return !!state.pp[pkey(li,p)];}
function partOpen(li,p){return p===0||partPassed(li,p-1);}
function markPassed(li,p){if(!partPassed(li,p)){state.pp[pkey(li,p)]=1;touch();}}
function curPart(li){return LESSONS[li].parts.findIndex((a,p)=>!partPassed(li,p));}
function nextLessonIdx(){for(let i=0;i<LESSONS.length;i++){if(curPart(i)>=0)return i;}return -1;}
function lessonDone(li){return curPart(li)<0;}
function testScore(li){const v=state.t[LESSONS[li].id];return typeof v==='number'?v:null;}
function testPassed(li){return (testScore(li)||0)>=PASS;}
function pendingTest(){for(let i=0;i<LESSONS.length;i++){if(lessonDone(i)&&!testPassed(i))return i;}return -1;}

/* ---------- learn: poznaj słowa → fiszki ---------- */
function startLearn(li,p){
  if(li==null||isNaN(li)||li<0)li=nextLessonIdx();
  if(li<0){go({name:'home'});return;}
  const L=LESSONS[li];
  if(p==null||isNaN(p)||p<0||p>=L.parts.length){p=curPart(li);if(p<0)p=0;}
  if(!partOpen(li,p)){go({name:'lesson',li:li,open:null});return;}
  const P=L.parts[p];
  let intro=P.filter(w=>!state.c[w.key]).map(w=>w.key);
  const relearn=!intro.length;
  if(relearn)intro=P.map(w=>w.key);
  session={kind:'learn',li:li,p:p,keys:intro,all:P.map(w=>w.key),fresh:new Set(relearn?[]:intro),i:0,known:[],phase:'cards'};
  view={name:'learn'};render();window.scrollTo(0,0);
}
function learnAdvance(){
  const s=session;s.i++;
  if(s.i<s.keys.length){render();return;}
  s.phase='flash';initFlash(s,s.all.filter(k=>s.known.indexOf(k)<0));
  if(!s.fl.deck.length)markPassed(s.li,s.p);
  render();window.scrollTo(0,0);
}
function renderLearn(){
  const s=session;
  if(s.phase==='flash')return renderFlash();
  const w=word(s.keys[s.i]);
  let dots='';for(let i=0;i<s.keys.length;i++)dots+='<i class="'+(i<=s.i?'on':'')+'"></i>';
  return '<div class="topbar">'+backBtn('Start','home')+'<span class="t">'+esc(LESSONS[s.li].label)+' · Teil '+(s.p+1)+' · '+(s.i+1)+'/'+s.keys.length+'</span></div><div class="dots" aria-hidden="true">'+dots+'</div>'
    +wordCard(w)
    +'<div class="row2"><button class="btn" data-a="known">Znam już</button><button class="btn btn-primary" data-a="next">'+(s.i+1<s.keys.length?'Dalej':'Fiszki →')+'</button></div>'
    +'<p class="kbd">Enter: dalej</p>';
}

/* ---------- flashcards (jak w Quizlecie) ---------- */
function initFlash(s,keys){s.fl={orig:keys.slice(),deck:shuffle(keys.slice()),i:0,flipped:false,know:[],still:[],round:1,seen:{},busy:false};}
function restartFlash(onlyStill){
  const f=session&&session.fl;if(!f)return;
  const keys=onlyStill?f.still.slice():f.orig.slice();
  f.deck=shuffle(keys);f.i=0;f.flipped=false;f.know=[];f.still=[];f.round++;f.busy=false;
  render();window.scrollTo(0,0);
}
function schedule(s,k,ok){
  const t=today();
  if(s.kind==='learn'&&s.fresh&&s.fresh.has(k)){setCard(k,1,t+(ok?1:0));state.l[k]=t;return;}
  if(s.kind==='review'){const c=state.c[k]||[1,t];if(ok){const box=Math.min(c[0]+1,MAXBOX);setCard(k,box,t+INTERVALS[box]);}else setCard(k,1,t+1);return;}
  if(!ok&&state.c[k])setCard(k,1,t);
}
function flashAnswer(ok){
  const s=session,f=s&&s.fl;if(!f||f.i>=f.deck.length)return;
  const k=f.deck[f.i];(ok?f.know:f.still).push(k);
  if(!f.seen[k]){f.seen[k]=1;schedule(s,k,ok);logAnswer();touch();}
  f.i++;f.flipped=false;f.busy=false;

/* ---------- questions (quiz + sprawdzian) ---------- */
function grp(t){return (t==='m'||t==='f'||t==='n'||t==='p')?'N':t;}
function distractors(w){
  let c=LESSONS[w.li].items.filter(o=>o!==w&&grp(o.t)===grp(w.t));
  if(c.length<4)c=c.concat(shuffle(WORDS.filter(o=>o.li!==w.li&&grp(o.t)===grp(w.t))).slice(0,8));
  return shuffle(c.slice());
}
function qPl2De(w){
  const opts=[{html:hw(w),label:plainHw(w),ok:true}];
  if(isNoun(w)){
    const wrong=shuffle(['der','die','das'].filter(a=>a!==ART[w.t]))[0];
    opts.push({html:artHtml(wrong)+' '+esc(w.de),label:wrong+' '+w.de,ok:false});
  }
  for(const o of distractors(w)){if(opts.length>=4)break;if(opts.some(x=>x.label===plainHw(o)))continue;opts.push({html:hw(o),label:plainHw(o),ok:false});}
  return {type:'pl2de',w:w,prompt:'Jak to powiedzieć po niemiecku?',big:esc(w.pl),opts:shuffle(opts)};
}
function qDe2Pl(w){
  const opts=[{html:esc(w.pl),label:w.pl,ok:true}];
  for(const o of distractors(w)){if(opts.length>=4)break;if(opts.some(x=>x.label===o.pl))continue;opts.push({html:esc(o.pl),label:o.pl,ok:false});}
  return {type:'de2pl',w:w,prompt:'Co to znaczy?',big:'<span lang="de">'+hw(w)+'</span>',opts:shuffle(opts)};
}
function qArt(w){
  return {type:'art',w:w,prompt:'Jaki rodzajnik?',big:'<span lang="de">___ '+esc(w.de)+'</span>',sub:esc(w.pl),
    opts:['der','die','das'].map(a=>({html:artHtml(a),label:a,ok:a===ART[w.t]}))};
}

/* ---------- lesson test (sprawdzian) ---------- */
function norm(s){return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.,!?;:„“”"'’()]/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++)d.push([i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++){for(let j=1;j<=n;j++){let v=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,d[i-2][j-2]+1);d[i][j]=v;}}return d[m][n];}
function grade(w,ans){
  const a=norm(ans);if(!a)return {ok:false,note:'Brak odpowiedzi.'};
  const exps=[plainHw(w)];
  if(w.t==='v'&&/^sich /.test(w.de))exps.push(w.de.slice(5));
  if(w.t==='p')exps.push(w.de);
  for(const e of exps){if(a===norm(e))return {ok:true};}
  if(isNoun(w)){
    const noun=norm(w.de),parts=a.split(' '),art=parts[0],rest=parts.slice(1).join(' ');
    if(a===noun||(noun.length>=5&&lev(a,noun)<=1))return {ok:false,note:'Słowo dobrze, ale brakuje rodzajnika ('+ART[w.t]+').'};
    if(['der','die','das'].indexOf(art)>=0&&(rest===noun||(noun.length>=5&&lev(rest,noun)<=1))){
      if(art!==ART[w.t])return {ok:false,note:'Słowo dobrze, ale rodzajnik to '+ART[w.t]+'.'};
      return {ok:true,note:'Zaliczone, ale uważaj na pisownię: '+plainHw(w)+'.'};
    }
    return {ok:false,note:'Twoja odpowiedź: '+String(ans).trim()};
  }
  for(const e of exps){const n=norm(e);if(n.length>=6&&lev(a,n)<=1)return {ok:true,note:'Zaliczone, ale uważaj na pisownię: '+w.de+'.'};}
  return {ok:false,note:'Twoja odpowiedź: '+String(ans).trim()};
}
function qType(w){return {type:'type',w:w,prompt:'Napisz po niemiecku'+(ART[w.t]?' (z rodzajnikiem)':''),big:esc(w.pl)};}
function startTest(li){
  if(!lessonDone(li)){go({name:'lesson',li:li,open:null});return;}
  const pool=shuffle(LESSONS[li].items.slice()).slice(0,TEST_N);
  const q=pool.map(w=>{const r=Math.random();if(r<0.45)return qType(w);if(isNoun(w)&&r<0.62)return qArt(w);return r<0.81?qPl2De(w):qDe2Pl(w);});
  session={kind:'test',li:li,q:q,qi:0,answer:null,results:[],phase:'q'};
  view={name:'test'};render();window.scrollTo(0,0);
}
function answerTyped(val){
  const s=session;if(!s||s.answer!=null)return;const q=s.q[s.qi];if(!q||q.type!=='type')return;
  const g=grade(q.w,val);
  s.answer=-1;s.typed=val;s.typedOk=g.ok;s.note=g.note||'';
  s.results.push({k:q.w.key,ok:g.ok,typed:val});
  if(!g.ok&&state.c[q.w.key])setCard(q.w.key,1,today());
  logAnswer();touch();if(state.say)sayWord(q.w);render();
}
function finishTest(s){
  const ok=s.results.filter(r=>r.ok).length;
  s.score=s.results.length?Math.round(ok/s.results.length*100):0;
  s.prev=testScore(s.li);
  if(s.prev==null||s.score>s.prev)state.t[LESSONS[s.li].id]=s.score;
  touch();
}
function renderTest(){
  const s=session;
  if(s.phase!=='done')return renderQuestionScreen('Sprawdzian · '+LESSONS[s.li].label);
  const pass=s.score>=PASS,wrong=s.results.filter(r=>!r.ok);
  let h='<section class="done"><div class="eyebrow">Sprawdzian · '+esc(LESSONS[s.li].label)+' · '+esc(LESSONS[s.li].de)+'</div><div class="score '+(pass?'pass':'fail')+'">'+s.score+'%</div>';
  h+='<p>'+(pass?'Zaliczone! Próg to '+PASS+'%.':'Jeszcze nie. Do zaliczenia brakuje '+(PASS-s.score)+' pkt proc. Błędne słowa wrócą dziś w powtórce.')+(s.prev!=null?' Poprzedni najlepszy wynik: '+s.prev+'%.':'')+'</p></section>';
  if(wrong.length){
    h+='<div class="panel"><div class="eyebrow">Do poprawki ('+wrong.length+')</div><ul class="rlist">';
    wrong.forEach(r=>{const w=word(r.k);h+='<li><span class="mk bad">✗</span><span><b lang="de">'+hw(w)+'</b> · '+esc(w.pl)+(r.typed!=null?'<br><span class="muted small">Twoja odpowiedź: '+(String(r.typed).trim()?esc(r.typed):'(pusto)')+'</span>':'')+'</span></li>';});
    h+='</ul></div>';
  }
  const nli=nextLessonIdx(),due=dueKeys().length;
  h+='<div class="actions">';
  if(pass&&nli>=0)h+='<button class="btn btn-primary wide" data-a="part" data-arg="'+nli+':'+curPart(nli)+'">Dalej: '+esc(LESSONS[nli].label)+' · '+esc(LESSONS[nli].de)+'</button>';
  if(!pass&&due)h+='<button class="btn btn-primary wide" data-a="review">Powtórka z błędnymi słowami ('+due+')</button>';
  h+='<button class="btn wide" data-a="test" data-arg="'+s.li+'">'+(pass?'Zrób sprawdzian jeszcze raz':'Spróbuj jeszcze raz')+'</button>';
  h+='<button class="btn btn-quiet wide" data-a="home">Wróć na start</button></div>';
  return h;
}

  h+='</div><div class="actions">';
  const sc=testScore(li);
  if(lessonDone(li))h+='<button class="btn btn-primary wide" data-a="test" data-arg="'+li+'">Sprawdzian z lekcji · '+TEST_N+' pytań'+(sc!=null?' · najlepszy wynik '+sc+'%':'')+'</button>';
  else h+='<p class="muted small" style="margin:0">Sprawdzian odblokuje się po zaliczeniu fiszek ze wszystkich części.</p>';
  h+='<div class="row2"><button class="btn" data-a="quiz" data-arg="'+li+'">Quiz z lekcji</button><button class="btn" data-a="text" data-arg="'+li+'">Tekst do czytania</button></div></div>';
  h+='<ul class="wlist">';
  L.parts.forEach(P=>P.forEach(w=>{
    if(w===P[0])h+='<li class="wsep">Teil '+(w.pi+1)+'</li>';
    const st=status(w.key);const open=view.open===w.key;
    h+='<li><button class="wrow" data-a="expand" data-arg="'+esc(w.key)+'" aria-expanded="'+open+'"><span class="st '+st+'" title="'+(st==='new'?'nowe':st==='master'?'opanowane':'w nauce')+'"></span><span class="w"><b lang="de">'+hw(w)+'</b><span>'+esc(w.pl)+'</span></span></button>';
    if(open){
      h+='<div class="wdetail">';
      const f=formsText(w);if(f)h+='<div class="muted small" lang="de">'+esc(f)+'</div>';
      if(w.ex)h+='<div><span lang="de">'+esc(w.ex)+'</span><br><span class="muted small">'+esc(w.exPl)+'</span></div>';
      if(w.tip)h+='<div class="tip"><b>Uwaga:</b> '+esc(w.tip)+'</div>';
      h+='<div class="btns">';
      if(canSpeak)h+='<button class="icon-btn sm" data-a="say" data-arg="'+esc(w.key)+'" aria-label="Posłuchaj wymowy">'+SPK+'</button>';
      if(st!=='master')h+='<button class="btn btn-quiet" data-a="mark-known" data-arg="'+esc(w.key)+'">Znam już</button>';
      else h+='<span class="muted small">Opanowane</span>';
      h+='</div></div>';
    }
    h+='</li>';
  }));
  h+='</ul>';
  return h;
}

/* ---------- reading text ---------- */
const RX=/\{([^}|]+)(?:\|([^}]+))?\}/g;
function textHtml(src){
  let out='',last=0,m;RX.lastIndex=0;
  while((m=RX.exec(src))){
    out+=esc(src.slice(last,m.index));
    const w=word(m[2]||m[1]);
    out+=w?'<button class="tw t-'+(GCLS[w.t]||'x')+'" data-a="pop" data-arg="'+esc(w.key)+'">'+esc(m[1])+'</button>':esc(m[1]);
    last=RX.lastIndex;
  }
  return out+esc(src.slice(last));
}
function textPlain(src){return src.replace(RX,(m,a)=>a);}
function renderText(){
  const li=view.li;const L=LESSONS[li];
  let h='<div class="topbar">'+backBtn(L.label,'lesson',li)+'</div>';
  h+='<header class="lhead"><div class="eyebrow">'+esc(L.label)+' · Tekst</div><h1 lang="de">'+esc(L.de)+'</h1><div class="muted small">Kliknij podkreślone słowo, żeby zobaczyć tłumaczenie.</div></header>';
  h+='<div class="reader"><p lang="de">'+textHtml(L.text.de)+'</p></div>';
  if(view.pop){
    const w=word(view.pop);
    if(w)h+='<div class="pop"><div><div class="hwsm" lang="de">'+hw(w)+'</div><div>'+esc(w.pl)+'</div><div class="muted small">'+esc(LESSONS[w.li].label)+'</div></div>'+(canSpeak?'<button class="icon-btn" data-a="say" data-arg="'+esc(w.key)+'" aria-label="Posłuchaj wymowy">'+SPK+'</button>':'')+'</div>';
  }
  h+='<div class="row2">'+(canSpeak?'<button class="btn" data-a="saytext">Przeczytaj na głos</button>':'')+'<button class="btn" data-a="toggle-tr">'+(view.tr?'Ukryj tłumaczenie':'Pokaż tłumaczenie')+'</button></div>';
  if(view.tr)h+='<p class="tr">'+esc(L.text.pl)+'</p>';
  h+='<div class="actions"><button class="btn wide" data-a="quiz" data-arg="'+li+'">Quiz z lekcji</button></div>';
  return h;
}

/* ---------- events ---------- */
function pair(a){const p=String(a).split(':');return [+p[0],+p[1]];}
const H={
  home:()=>go({name:'home'}),
  lesson:a=>go({name:'lesson',li:+a,open:null}),
  learnp:a=>{const p=pair(a);startLearn(p[0],p[1]);},
  part:a=>{const p=pair(a);startPart(p[0],p[1]);},
  update:()=>{const done=()=>location.reload();try{navigator.serviceWorker.getRegistration().then(r=>r?r.update():null).then(done,done);}catch(e){done();}},
  practice:a=>{const p=pair(a);startPractice(p[0],p[1]);},
  review:()=>startReview(),
  quiz:a=>startQuiz(+a),
  test:a=>startTest(+a),
  text:a=>go({name:'text',li:+a,tr:false,pop:null}),
  say:a=>{const w=word(a);if(w)sayWord(w);},
  sayex:a=>{const w=word(a);if(w)say(w.ex);},
  saytext:()=>say(textPlain(LESSONS[view.li].text.de)),
  next:()=>{if(session&&session.kind==='learn'&&session.phase==='cards')learnAdvance();},
  known:()=>{const s=session;if(!s||s.kind!=='learn'||s.phase!=='cards')return;const k=s.keys[s.i];
    if(s.fresh.has(k)){setCard(k,MASTER,today()+INTERVALS[MASTER]);s.fresh.delete(k);}
    s.known.push(k);logAnswer();touch();learnAdvance();},
  'fl-yes':()=>flyAnswer(true),
  'fl-no':()=>flyAnswer(false),
  'fl-again-still':()=>restartFlash(true),
  'fl-again-all':()=>restartFlash(false),
  dir:a=>{state.dir=a==='pl'?'pl':'de';touch();if(session&&session.fl)session.fl.flipped=false;render();},
  answer:a=>answer(+a),
  qnext:()=>qnext(),
  ins:a=>{const i=document.getElementById('ans');if(!i||i.disabled)return;const st=i.selectionStart==null?i.value.length:i.selectionStart,en=i.selectionEnd==null?st:i.selectionEnd;i.setRangeText(a,st,en,'end');i.focus();},
  expand:a=>{view.open=view.open===a?null:a;render();},
  'mark-known':a=>{setCard(a,MASTER,today()+INTERVALS[MASTER]);logAnswer();touch();render();},
  pop:a=>{view.pop=a;render();const w=word(a);if(w&&state.say)sayWord(w);},
  'toggle-tr':()=>{view.tr=!view.tr;render();},
  'toggle-say':(a,el)=>{state.say=!!el.checked;touch();},
  export:()=>{
    const code=exportCode(),ta=document.getElementById('exp-code'),msg=document.getElementById('exp-msg');
    ta.value=code;ta.hidden=false;
    const fallback=()=>{ta.focus();ta.select();msg.textContent='Zaznaczyłem kod. Skopiuj go ręcznie (Kopiuj).';};
    try{navigator.clipboard.writeText(code).then(()=>{msg.textContent='Skopiowano kod ('+slow(Object.keys(state.c).length)+').';},fallback);}catch(e){fallback();}
  },
  import:()=>{
    const ta=document.getElementById('imp-code'),msg=document.getElementById('imp-msg');
    const s=importCode(ta.value);
    if(!s){msg.textContent='Ten kod nie wygląda na kod postępu. Skopiuj go jeszcze raz w całości.';return;}
    pendingImport=s;
    msg.innerHTML='Kod zawiera '+slow(Object.keys(s.c).length)+'. Zastąpić nim obecny postęp na tym urządzeniu ('+slow(Object.keys(state.c).length)+')? <button class="btn" data-a="import-yes">Tak, wczytaj</button> <button class="btn btn-quiet" data-a="import-no">Anuluj</button>';
  },
  'import-yes':()=>{if(!pendingImport)return;state=pendingImport;pendingImport=null;state.savedAt=Date.now();touch();view={name:'home'};render();window.scrollTo(0,0);},
  'import-no':()=>{pendingImport=null;const m=document.getElementById('imp-msg');if(m)m.textContent='';},
  reset:()=>{view.confirmReset=true;render();},
  'reset-no':()=>{view.confirmReset=false;render();},
  'reset-yes':()=>{const d=state.dir;state=fresh();state.dir=d;state.savedAt=Date.now();saveLocal();touch();view={name:'home'};render();}
};
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||!app.contains(el))return;
  const fn=H[el.dataset.a];if(fn)fn(el.dataset.arg,el);
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target&&e.target.id==='tform'){const i=document.getElementById('ans');answerTyped(i?i.value:'');}
});

/* tap = odwróć, przesunięcie = umiem / jeszcze nie */
let drag=null;
app.addEventListener('pointerdown',e=>{
  const c=e.target.closest('#fc');if(!c||e.target.closest('button'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  drag={x:e.clientX,y:e.clientY,el:c,dx:0,moved:false,id:e.pointerId};
});
app.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){drag.moved=true;drag.el.classList.add('dragging');try{drag.el.setPointerCapture(e.pointerId);}catch(_){}}
    else if(Math.abs(dy)>12){drag=null;return;}
  }
  if(drag.moved){
    drag.dx=dx;drag.el.style.transform='translateX('+dx+'px) rotate('+(dx/24)+'deg)';
    drag.el.classList.toggle('to-know',dx>60);drag.el.classList.toggle('to-still',dx<-60);
  }
});
function endDrag(cancel){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){if(!cancel)flip();return;}
  d.el.classList.remove('dragging');
  if(!cancel&&Math.abs(d.dx)>90){flyAnswer(d.dx>0);}
  else{d.el.style.transform='';d.el.classList.remove('to-know','to-still');}
}
app.addEventListener('pointerup',()=>endDrag(false));
app.addEventListener('pointercancel',()=>endDrag(true));

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
  const s=session;if(!s)return;
  const inFlash=s.fl&&(view.name==='flash'||(view.name==='learn'&&s.phase==='flash'));
  if(inFlash&&s.fl.i<s.fl.deck.length){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();return;}
    if(e.key==='ArrowRight'||e.key==='2'){e.preventDefault();flyAnswer(true);return;}
    if(e.key==='ArrowLeft'||e.key==='1'){e.preventDefault();flyAnswer(false);return;}
    return;
  }
  if(view.name==='learn'&&s.phase==='cards'&&e.key==='Enter'){e.preventDefault();learnAdvance();return;}
  if((view.name==='quiz'||view.name==='test')&&s.phase!=='done'){
    const cq=s.q[s.qi];
    if(s.answer==null&&cq&&cq.type!=='type'&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key-1);return;}
    if(s.answer!=null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();qnext();return;}
  }
});

render();
connect();
if(STANDALONE){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
})();
</script>
